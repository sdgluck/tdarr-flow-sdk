name: Vendor plugins

# The vendored Tdarr plugin source is a snapshot of an upstream repo that is
# versioned independently and carries no tags, so nothing tells us it has moved.
# This checks daily and fails loudly when the snapshot goes stale.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm plugins:check
        env:
          # Unauthenticated GitHub API requests are rate limited per IP, which
          # shared runners exhaust. The default token lifts the limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A stale generated catalog is the same class of problem as a stale
      # vendor tree, so it rings the same alarm.
      - run: pnpm catalog:check
